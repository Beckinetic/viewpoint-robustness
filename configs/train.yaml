data:
  train:
    batch_size: 32
    num_classes: 32
    view:
      - f
      - r
      - er
      - fx
    res:
      - f
    background:
      - meadow
      - forest
      - desert
      - industrial
  validation:
    batch_size: 32
    num_classes: 32
    view:
      - f
      - r
      - fx
      - er
    res:
      - f
    background:
      - meadow
      - forest
      - desert
      - industrial

model:
  backbone: resnet18
  pretrained: false
  epochs: 100
  checkpoint: 2

optimizer:
  optimizer_name: SGD
  learning_rate: 0.001
  weight_decay: 0.001
  momentum: 0.9

criterion:
  criterion_name: CrossEntropyLoss

scheduler:
  scheduler_name: StepLR
  step_size: 10
  gamma: 0.1