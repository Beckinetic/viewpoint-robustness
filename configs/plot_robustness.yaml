  view:
    - "Fixed view"
    - "Extra restricted view"
    - "Restricted view"
    - "Full view"
  shape_bias_metric:
    - "Shape and Texture Decision Ratio"
    - "Shape Decision Ratio"
    - "Texture Decision Ratio"
    - "Shape Bias"
  distortion_types:
    - gaussian_noise
