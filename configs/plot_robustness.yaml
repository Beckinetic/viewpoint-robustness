  acc_change_min: -80
  acc_change_max: 5
  decision_proportion_min: 0
  decision_proportion_max: 0.26
  shape_bias_min: 0
  shape_bias_max: 0.26
  palette:
    fx: "#009ADE"
    er: "#AF58BA"
    r: "#00CD6C"
    f : "#FF1F5B"
  palette_shape_bias:
