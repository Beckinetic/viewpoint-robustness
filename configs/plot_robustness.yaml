log:
  view:
    - fx
    - er
    - r
    - f
  background:
    - combined
  res: combined
  eval:
    view:
      - f
      - r
      - er
      - fx
      - cr
    ood_view:
      - cr
    suffix:

model:
  model_name: resnet18
  max_epoch: 30

plot:
