data:
  root: ../data/
  batch_size: 32
  num_classes: 32
  view:
    - r
  res:
    - f
  background:
    - forest

model:
  model_name: resnet18
  pretrained: false

training:
  epochs: 30
  check_point: 1

optimizer:
  optimizer_name: SGD
  learning_rate: 0.001
  weight_decay: 0.001
  momentum: 0.9

criterion:
  criterion_name: CrossEntropyLoss

scheduler:
  scheduler_name: StepLR
  step_size: 10
  gamma: 0.1