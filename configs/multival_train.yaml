data:
  root: ../data/
  batch_size: 32
  num_classes: 32
  view:
    - f
    - r
    - fx
  res:
    - f
  background:
    - meadow
    - forest
    - desert
    - industrial

model:
  model_name: resnet18
  pretrained: false

training:
  epochs: 100
  check_point: 2

optimizer:
  optimizer_name: SGD
  learning_rate: 0.001
  weight_decay: 0.001
  momentum: 0.9

criterion:
  criterion_name: CrossEntropyLoss

scheduler:
  scheduler_name: StepLR
  step_size: 10
  gamma: 0.1