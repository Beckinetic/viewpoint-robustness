data:
  root: ../data/
  batch_size: 32
  num_classes: 32
  data_folders:
    - meadow_fx_f
    - forest_fx_f
    - desert_fx_f
    - industrial_fx_f

mix:
  biased_ratios_val:
    - 0.1
    - 0.25
    - 0.5
    - 0.7
    - 0.9
  biased_ratios_train:
    - 0.1
    - 0.25
    - 0.5
    - 0.7
    - 0.9
  view: fx
  res: f

model:
  model_name: resnet18
  pretrained: false

training:
  epochs: 30
  check_point: 30

optimizer:
  optimizer_name: SGD
  learning_rate: 0.001
  weight_decay: 0.001
  momentum: 0.9

criterion:
  criterion_name: CrossEntropyLoss

scheduler:
  scheduler_name: StepLR
  step_size: 10
  gamma: 0.1